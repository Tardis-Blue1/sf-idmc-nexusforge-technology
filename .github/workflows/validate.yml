name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Integration + acceptance
        run: pytest tests/integration tests/acceptance -q
      - name: Tenant isolation script
        run: bash infra/scripts/validate-tenant-isolation.sh
