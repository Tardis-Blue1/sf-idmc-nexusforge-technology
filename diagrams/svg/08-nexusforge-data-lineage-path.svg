<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">NexusForge Systems — Mandatory Data Lineage Path</title>
  <desc id="desc">End-to-end lineage from source system field through Informatica IDMC CDI/CAI, MDM, DQ, Catalog, Salesforce/Data Cloud, Agentforce, and audit log.</desc>
  <defs>
