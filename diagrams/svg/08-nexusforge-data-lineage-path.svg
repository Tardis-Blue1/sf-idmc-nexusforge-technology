  <text x="1155" y="190" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Agentforce</text>
  <text x="1155" y="210" text-anchor="middle" fill="#B3D4F5" font-family="Arial, Helvetica, sans-serif" font-size="11">tool / action</text>

