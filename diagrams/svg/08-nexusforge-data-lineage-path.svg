  <rect x="30" y="360" width="1340" height="70" rx="8" fill="#FFFFFF" stroke="#0B3B4D"/>
  <text x="700" y="390" text-anchor="middle" fill="#0B3B4D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Pilot completeness: ≥95% of attributes in dp.customer.golden, dp.device.fleet, dp.entitlement.active show lineage to source in Catalog</text>
