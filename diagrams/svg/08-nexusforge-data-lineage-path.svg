      <stop offset="0%" stop-color="#F4F8FC"/>
      <stop offset="100%" stop-color="#E8F1F8"/>
    </linearGradient>
    <marker id="arrow8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#032D60"/>
    </marker>
  </defs>
  <rect width="1400" height="520" fill="url(#bg8)"/>

  <rect x="24" y="18" width="150" height="36" rx="4" fill="#0176D3"/>
  <text x="99" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Salesforce</text>
  <rect x="186" y="18" width="170" height="36" rx="4" fill="#0B3B4D"/>
  <text x="271" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Informatica IDMC</text>

