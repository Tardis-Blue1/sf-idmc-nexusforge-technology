<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img">
  <title>NexusForge — Subscription &amp; Device Data Flow</title>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#032D60"/></marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F5F9FC"/><stop offset="100%" stop-color="#E8F2F0"/></linearGradient>
  </defs>
  <rect width="1400" height="880" fill="url(#bg3)"/>
  <rect x="24" y="18" width="150" height="36" rx="4" fill="#0176D3"/>
  <text x="99" y="41" text-anchor="middle" fill="#FFF" font-family="Arial,sans-serif" font-size="14" font-weight="700">Salesforce</text>
  <rect x="186" y="18" width="170" height="36" rx="4" fill="#0B3B4D"/>
  <text x="271" y="41" text-anchor="middle" fill="#FFF" font-family="Arial,sans-serif" font-size="13" font-weight="700">Informatica IDMC</text>
  <text x="700" y="88" text-anchor="middle" fill="#032D60" font-family="Arial,sans-serif" font-size="20" font-weight="700">NexusForge Systems — Agentic Customer &amp; Product Data Platform</text>
  <text x="700" y="112" text-anchor="middle" fill="#0176D3" font-family="Arial,sans-serif" font-size="14">Data Flow — Subscription Upgrade &amp; Device Activation (CDC → MDM → Agents)</text>

  <!-- Sources -->
  <text x="120" y="160" text-anchor="middle" fill="#181818" font-family="Arial,sans-serif" font-size="12" font-weight="700">SOURCES</text>
  <rect x="40" y="175" width="160" height="70" rx="6" fill="#FFF4E5" stroke="#DD7A01"/>
  <text x="120" y="205" text-anchor="middle" fill="#181818" font-family="Arial,sans-serif" font-size="13" font-weight="700">Stripe</text>
  <text x="120" y="225" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="11">sub.updated CDC</text>
  <rect x="40" y="265" width="160" height="70" rx="6" fill="#FFF4E5" stroke="#DD7A01"/>
  <text x="120" y="295" text-anchor="middle" fill="#181818" font-family="Arial,sans-serif" font-size="13" font-weight="700">ForgeObserve</text>
  <text x="120" y="315" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="11">org / seats API</text>
  <rect x="40" y="355" width="160" height="70" rx="6" fill="#FFF4E5" stroke="#DD7A01"/>
  <text x="120" y="385" text-anchor="middle" fill="#181818" font-family="Arial,sans-serif" font-size="13" font-weight="700">Device Registry</text>
  <text x="120" y="405" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="11">serial · firmware</text>
  <rect x="40" y="445" width="160" height="70" rx="6" fill="#FFF4E5" stroke="#DD7A01"/>
  <text x="120" y="475" text-anchor="middle" fill="#181818" font-family="Arial,sans-serif" font-size="13" font-weight="700">NetSuite</text>
  <text x="120" y="495" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="11">invoice / customer</text>

  <!-- IDMC pipeline -->
  <rect x="280" y="175" width="520" height="340" rx="10" fill="#FFFFFF" stroke="#0B3B4D" stroke-width="2"/>
  <text x="540" y="205" text-anchor="middle" fill="#0B3B4D" font-family="Arial,sans-serif" font-size="14" font-weight="700">Informatica IDMC Pipeline</text>
  <rect x="310" y="230" width="200" height="60" rx="6" fill="#E6F4F1" stroke="#0B8A7A"/>
  <text x="410" y="265" text-anchor="middle" fill="#0B3B4D" font-family="Arial,sans-serif" font-size="13" font-weight="700">CDI / CAI Ingest</text>
  <rect x="560" y="230" width="200" height="60" rx="6" fill="#D9F2EC" stroke="#0B8A7A"/>
  <text x="660" y="265" text-anchor="middle" fill="#0B3B4D" font-family="Arial,sans-serif" font-size="13" font-weight="700">DQ Gates</text>
  <rect x="310" y="320" width="450" height="70" rx="6" fill="#CFE8E2" stroke="#0B8A7A"/>
  <text x="535" y="350" text-anchor="middle" fill="#0B3B4D" font-family="Arial,sans-serif" font-size="13" font-weight="700">MDM Match / Merge / Survivorship</text>
  <text x="535" y="370" text-anchor="middle" fill="#3D5A5A" font-family="Arial,sans-serif" font-size="11">Publish golden keys + crosswalk IDs</text>
  <rect x="310" y="415" width="200" height="60" rx="6" fill="#BFE0D8" stroke="#0B8A7A"/>
  <text x="410" y="450" text-anchor="middle" fill="#0B3B4D" font-family="Arial,sans-serif" font-size="12" font-weight="700">Catalog certify</text>
  <rect x="560" y="415" width="200" height="60" rx="6" fill="#FFEEEE" stroke="#BA0517"/>
  <text x="660" y="440" text-anchor="middle" fill="#BA0517" font-family="Arial,sans-serif" font-size="12" font-weight="700">Quarantine</text>
  <text x="660" y="458" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="10">DQ fail / steward</text>

  <!-- Salesforce targets -->
  <rect x="880" y="175" width="480" height="340" rx="10" fill="#FFFFFF" stroke="#0176D3" stroke-width="2"/>
  <text x="1120" y="205" text-anchor="middle" fill="#0176D3" font-family="Arial,sans-serif" font-size="14" font-weight="700">Salesforce Activation</text>
  <rect x="910" y="230" width="200" height="70" rx="6" fill="#EAF5FE" stroke="#0176D3"/>
  <text x="1010" y="260" text-anchor="middle" fill="#032D60" font-family="Arial,sans-serif" font-size="13" font-weight="700">Sales / Service</text>
  <text x="1010" y="280" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="11">Contract · Entitlement · Device</text>
  <rect x="1130" y="230" width="200" height="70" rx="6" fill="#D8E6FE" stroke="#0176D3"/>
  <text x="1230" y="260" text-anchor="middle" fill="#032D60" font-family="Arial,sans-serif" font-size="13" font-weight="700">Data Cloud</text>
  <text x="1230" y="280" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="11">Unified profile · Insights</text>
  <rect x="910" y="330" width="420" height="80" rx="6" fill="#032D60"/>
  <text x="1120" y="365" text-anchor="middle" fill="#FFF" font-family="Arial,sans-serif" font-size="14" font-weight="700">Agentforce Tooling</text>
  <text x="1120" y="388" text-anchor="middle" fill="#B3D4F5" font-family="Arial,sans-serif" font-size="11">Reads certified products only · correlation ID on write-back</text>
  <rect x="910" y="430" width="420" height="50" rx="6" fill="#F3F3F3" stroke="#747474"/>
  <text x="1120" y="460" text-anchor="middle" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">Snowflake analytical mirror (no agent write-back SoT)</text>

  <!-- Arrows -->
  <line x1="200" y1="210" x2="280" y2="250" stroke="#032D60" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="200" y1="300" x2="280" y2="280" stroke="#032D60" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="200" y1="390" x2="280" y2="340" stroke="#032D60" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="200" y1="480" x2="280" y2="400" stroke="#032D60" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="800" y1="350" x2="880" y2="350" stroke="#032D60" stroke-width="2" marker-end="url(#a3)"/>
  <text x="840" y="340" fill="#032D60" font-family="Arial,sans-serif" font-size="10">golden</text>

  <!-- Sequence callouts -->
  <rect x="40" y="560" width="1320" height="230" rx="10" fill="#FFFFFF" stroke="#747474"/>
  <text x="60" y="590" fill="#032D60" font-family="Arial,sans-serif" font-size="14" font-weight="700">Happy-path sequence (pilot SLA &lt;5 min median)</text>
  <text x="60" y="620" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">1. Stripe subscription upgrade event → IDMC CAI process (correlation ID generated).</text>
  <text x="60" y="642" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">2. DQ validates price ID ↔ ProductSKU crosswalk; PAN/token fields stripped before catalog publish.</text>
  <text x="60" y="664" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">3. MDM updates Subscription golden + Entitlement; Account hierarchy survivorship applied.</text>
  <text x="60" y="686" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">4. CDI upserts Salesforce Contract/Entitlement__c; Data Cloud recalculates entitlement-risk insight.</text>
  <text x="60" y="708" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">5. Device activation from Registry binds serial to golden Account; match confidence scored.</text>
  <text x="60" y="730" fill="#3E3E3C" font-family="Arial,sans-serif" font-size="12">6. Agentforce trial/support agents retrieve dp.entitlement.active + dp.device.fleet — never raw Stripe tokens.</text>
  <text x="60" y="760" fill="#0B8A7A" font-family="Arial,sans-serif" font-size="12" font-weight="700">Buy-vs-build: lineage + match confidence + policy deny are IDMC control-plane capabilities DIY Glue cannot sustain.</text>

  <text x="700" y="850" text-anchor="middle" fill="#5C6B7A" font-family="Arial,sans-serif" font-size="10">Salesforce · Informatica engagement materials · NexusForge fictional · Diagram 03/06 · Subscription/Device data flow</text>
</svg>
