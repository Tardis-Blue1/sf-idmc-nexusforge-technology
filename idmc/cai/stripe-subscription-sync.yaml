# Informatica IDMC — Cloud Application Integration (CAI)
# NexusForge Systems: Stripe subscription → Salesforce Entitlement sync
apiVersion: idmc.informatica.com/v1
kind: CAIProcess
metadata:
  name: stripe-subscription-sync
  customer: NexusForge Systems
  platforms:
    - Informatica IDMC CAI
    - Salesforce Sales/Service Cloud
  labels:
    domain: subscription
    product_lines:
      - ForgeObserve
      - ForgeEdge
spec:
  description: >
    Event/schedule driven sync of Stripe subscription state into Informatica MDM
    Subscription master and Salesforce Entitlement__c via golden keys.
  trigger:
    type: webhook_or_schedule
    schedule_cron: "*/5 * * * *"
    webhook_path: /nexusforge/stripe/subscription
  correlation:
    header: X-NexusForge-Correlation-Id
    generate_if_missing: true
    propagate_to:
      - mdm
      - salesforce
      - audit_log
  connectors:
    - name: stripe_billing
      type: rest
      secret_ref: secrets/nexusforge/nonprod/stripe_api
      # No secret values in repo
    - name: idmc_mdm
      type: mdm_saas
      secret_ref: secrets/nexusforge/nonprod/idmc_mdm
    - name: salesforce_crm
      type: salesforce
      secret_ref: secrets/nexusforge/nonprod/salesforce_integration
  steps:
    - id: receive_event
      action: parse_payload
      outputs: [subscription_id, customer_id, price_id, status, tier]
    - id: ensure_correlation
      action: set_correlation_id
      from_header: X-NexusForge-Correlation-Id
    - id: match_customer
      action: mdm_lookup
      entity: customer
      keys: [stripe_customer_id, netsuite_customer_id]
      output: golden_account_key
    - id: match_product
      action: mdm_lookup
      entity: product
      keys: [stripe_price_id, sku_code]
      output: golden_product_key
    - id: upsert_subscription_master
      action: mdm_upsert
      entity: subscription
      golden_key_field: golden_entitlement_key
      idempotent: true
    - id: upsert_salesforce_entitlement
      action: salesforce_apex
      class: NexusForgeEntitlementService.upsertEntitlement
      named_credential: IDMC_CAI_API
      payload_map:
        goldenEntitlementKey: $.golden_entitlement_key
        goldenAccountKey: $.golden_account_key
        goldenProductKey: $.golden_product_key
        stripeSubId: $.subscription_id
        status: $.status
        tier: $.tier
        correlationId: $.correlation_id
    - id: emit_metrics
      action: observe
      metrics: [sync_lag_ms, upsert_created, upsert_updated]
  error_handling:
    poison_queue: nexusforge-stripe-subscription-dlq
    retry:
      max_attempts: 5
      backoff: exponential
  sla:
    median_consistency_minutes: 5
